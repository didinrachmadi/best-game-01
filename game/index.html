<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall — Survive the Night</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05060f;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    outline: none;
  }
  noscript {
    display: block;
    padding: 2rem;
    color: #ffe9b0;
    font-family: Georgia, serif;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Emberfall — a top-down arena survival game. Move with WASD or arrow keys, dash with Space."></canvas>
<noscript>Emberfall needs JavaScript to play.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
